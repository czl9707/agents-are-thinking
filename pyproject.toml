[project]
name = "agents-are-thinking"
version = "0.1.0"
description = "Terminal animation effects built with braille, block characters, and unicode glyphs"
readme = "README.md"
requires-python = ">=3.11, <3.15"

[project.optional-dependencies]
cli = [
    "click>=8.3.3",
    "rich>=15.0.0",
]

[project.scripts]
agents-are-thinking = "agents_are_thinking.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.bumpversion]
current_version = "0.1.0"
parse = """(?x)
  (?P<major>0|[1-9]\\d*)\\.
  (?P<minor>0|[1-9]\\d*)\\.
  (?P<patch>0|[1-9]\\d*)
"""
serialize = [
  "{major}.{minor}.{patch}",
]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
tag = false
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""
