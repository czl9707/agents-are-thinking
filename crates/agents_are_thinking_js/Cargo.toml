[package]
name = "agents-are-thinking-js"
version = "0.1.0"
edition = "2024"
description = "Terminal animation effects for agents' thinking state — WASM/JS bindings"
license = "MIT"
homepage = "https://github.com/czl9707/agents-are-thinking/tree/main"
repository = "https://github.com/czl9707/agents-are-thinking"

[lib]
crate-type = ["cdylib"]

[dependencies]
agents-are-thinking = { path = "../agents_are_thinking" }
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
